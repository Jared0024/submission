[package]
name = "session-pipeline"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
hashbrown = { version = "0.16", default-features = false }
memchr = "2"
memmap2 = "0.9"
parquet = { version = "=57.3.0", default-features = false, features = ["snap"] }
rayon = "1.10"
rustc-hash = "2"
serde_json = "1"
